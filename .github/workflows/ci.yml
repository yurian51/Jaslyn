name: Jaslyn CI

on:
  push:
    branches: ["main", "feat/openclaw-benchmark-runtime"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: jaslyn-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Runtime versions
        run: node --version && npm --version
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Dependency-free runtime selftest
        run: npm run benchmark:selftest
