name: Jaslyn CI

on:
  push:
    branches: ["main", "feat/openclaw-benchmark-runtime"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: jaslyn-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Runtime versions
        run: node --version && npm --version
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: JavaScript boundary audit
        run: npm run language:audit
      - name: JavaScript syntax validation
        run: node --check src/index.mjs && node --check src/bridge/python-runner.mjs && node --check app/api/chat/route.js
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Benchmark self-test
        run: npm run benchmark:selftest
      - name: Benchmark security regression
        run: npm run benchmark:security
